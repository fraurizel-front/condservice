<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Portal do condomínio</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main class="card">
    <div class="brand" aria-hidden="true">C</div>
    <h1>Portal do condomínio</h1>
    <p class="subtitle">Acesse sua área de gestão e convivência.</p>
    <form id="login-form">
      <label class="field">
        <span>E-mail ou CPF</span>
        <input type="text" name="username" placeholder="Digite seu e-mail ou CPF" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Senha</span>
        <input type="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
      </label>
      <div class="options">
        <label class="remember"><input type="checkbox" name="remember"> Lembrar-me</label>
        <a href="#recuperar">Esqueci minha senha</a>
      </div>
      <button class="button" type="submit">Entrar</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="signup">Ainda não possui acesso? <a href="#cadastro">Fale com a administradora</a></p>
  </main>
  <script src="static/script.js"></script>
</body>
</html>
